<style>
/* Layout concept: a school exercise book (Heft) — reading column on white paper, every
   diagram on squared Karopapier, corrections in red pen, confirmations in green ink. */
:root {
  --paper: #f4f6f9;
  --sheet: #ffffff;
  --sheet-2: #f8fafc;
  --grid: #e1e8f0;
  --rule: #d3dbe6;
  --ink: #152033;
  --ink-2: #4a5870;
  --ink-3: #7a879b;
  --blue: #2445b5;
  --blue-2: #1b3590;
  --blue-soft: #e7ecfb;
  --red: #c8322b;
  --red-soft: #fcebea;
  --green: #17804b;
  --green-soft: #e2f3e9;
  --amber: #a86a0b;
  --amber-soft: #fdf2db;
  --violet: #6d3fc0;
  --violet-soft: #efe8fb;
  --code-bg: #f3f6fa;
  --code-ink: #1b2536;
  --syn-kw: #2445b5;
  --syn-def: #8a3fb8;
  --syn-str: #17804b;
  --syn-num: #a8550b;
  --syn-com: #7a879b;
  --syn-builtin: #b02a5c;
  --syn-op: #4a5870;
  --shadow: 0 1px 2px rgba(21,32,51,.06), 0 4px 16px rgba(21,32,51,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --radius: 10px;
  --side-w: 296px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d121b; --sheet: #141b27; --sheet-2: #18202e; --grid: #1f2a3b; --rule: #2a3649;
    --ink: #e3e9f2; --ink-2: #a3b0c4; --ink-3: #75839a;
    --blue: #8ea6ff; --blue-2: #b3c3ff; --blue-soft: #1c2747;
    --red: #ff7b72; --red-soft: #3a1c1f; --green: #52cf8e; --green-soft: #142d20;
    --amber: #f0b45a; --amber-soft: #33270f; --violet: #b99bff; --violet-soft: #2a2145;
    --code-bg: #101722; --code-ink: #dfe6f1;
    --syn-kw: #8ea6ff; --syn-def: #d3a3ff; --syn-str: #7fd6a5; --syn-num: #f0b45a; --syn-com: #6f7d93; --syn-builtin: #ff8fb4; --syn-op: #a3b0c4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d121b; --sheet: #141b27; --sheet-2: #18202e; --grid: #1f2a3b; --rule: #2a3649;
  --ink: #e3e9f2; --ink-2: #a3b0c4; --ink-3: #75839a;
  --blue: #8ea6ff; --blue-2: #b3c3ff; --blue-soft: #1c2747;
  --red: #ff7b72; --red-soft: #3a1c1f; --green: #52cf8e; --green-soft: #142d20;
  --amber: #f0b45a; --amber-soft: #33270f; --violet: #b99bff; --violet-soft: #2a2145;
  --code-bg: #101722; --code-ink: #dfe6f1;
  --syn-kw: #8ea6ff; --syn-def: #d3a3ff; --syn-str: #7fd6a5; --syn-num: #f0b45a; --syn-com: #6f7d93; --syn-builtin: #ff8fb4; --syn-op: #a3b0c4;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--sheet); }
a { color: var(--blue); text-underline-offset: 3px; }
a:hover { color: var(--blue-2); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.18; text-wrap: balance; letter-spacing: -0.01em; }
code, kbd, pre, .mono { font-family: var(--f-mono); font-size: .88em; }
kbd { border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 .35em; background: var(--sheet); }

/* ------------------------------------------------------------------ shell */
#app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
#sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-right: 1px solid var(--rule);
  padding: 20px 0 40px; padding-left: env(safe-area-inset-left, 0px);
}
#main-wrap { min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
  background: color-mix(in srgb, var(--sheet) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#menu-btn { display: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.crumbs { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--ink); font-weight: 700; }
.py-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px 4px 10px; background: var(--sheet); color: var(--ink-2); white-space: nowrap; cursor: default; }
.py-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.py-chip[data-state="loading"] .dot { background: var(--amber); animation: pulse 1s infinite; }
.py-chip[data-state="ready"] .dot { background: var(--green); }
.py-chip[data-state="error"] .dot { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
#main { flex: 1; padding-block: 32px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* sidebar */
.brand { padding: 4px 22px 18px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
.brand a { text-decoration: none; color: inherit; display: block; }
.brand .mark { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; }
.brand .mark span { color: var(--red); }
.brand .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.progress { height: 6px; border-radius: 6px; background: var(--grid); overflow: hidden; margin-top: 12px; }
.progress > i { display: block; height: 100%; background: var(--green); width: 0; transition: width .4s; }
.progress-label { font-size: 12px; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.nav-part { padding: 10px 12px 4px; }
.nav-part-h { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.part-badge { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 14px; color: #fff; background: var(--pc, var(--blue)); }
.nav-part-h .frac { margin-left: auto; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-list { list-style: none; margin: 0; padding: 0 0 6px; }
.nav-list a { display: grid; grid-template-columns: 36px 1fr auto; align-items: baseline; gap: 4px; padding: 6px 10px 6px 12px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-size: 14.5px; line-height: 1.35; }
.nav-list a:hover { background: var(--sheet-2); color: var(--ink); }
.nav-list a.active { background: var(--blue-soft); color: var(--ink); font-weight: 700; }
.nav-list .num { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.nav-list .st { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-list .st.done { color: var(--green); font-weight: 700; }

/* ------------------------------------------------------------------ lesson */
.page { width: 100%; max-width: 900px; margin: 0 auto; min-width: 0; }
.page-grid > * { min-width: 0; }
.page-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; max-width: 1180px; margin: 0 auto; }
@media (min-width: 1500px) { .page-grid { grid-template-columns: minmax(0, 900px) 220px; justify-content: center; } }
.toc { display: none; }
@media (min-width: 1500px) {
  .toc { display: block; position: sticky; top: 84px; align-self: start; font-size: 13.5px; border-left: 1px solid var(--rule); padding-left: 16px; max-height: calc(100vh - 110px); overflow: auto; }
  .toc h4 { font-family: var(--f-body); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 3px 0; line-height: 1.35; }
  .toc a:hover { color: var(--blue); }
  .toc a .ph { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; margin-right: 6px; }
}
.lesson-head { padding-bottom: 24px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow .part-badge { width: 22px; height: 22px; font-size: 12px; letter-spacing: 0; }
.lesson-head h1 { font-size: clamp(30px, 4.2vw, 44px); font-weight: 800; margin: 10px 0 10px; }
.lead { font-size: 19px; color: var(--ink-2); max-width: 68ch; margin: 0 0 18px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); }
.meta-row span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.goals { margin-top: 20px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 20px; }
.goals h4 { margin: 0 0 6px; font-size: 15px; }
.goals ul { margin: 0; padding-left: 20px; }
.goals li { margin: 3px 0; }
.links-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; font-size: 14px; color: var(--ink-2); }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 2px 10px; font-size: 13px; text-decoration: none; color: var(--ink); }
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }

.prose { max-width: 72ch; }
.prose p, .prose li { max-width: 72ch; }
.content > h2 { font-size: 28px; margin: 56px 0 14px; padding-top: 6px; }
.content > h3 { font-size: 21px; margin: 34px 0 10px; }
.content > h4 { font-size: 17px; margin: 24px 0 6px; }
.content > p, .content > ul, .content > ol { max-width: 72ch; }
.content li { margin: 4px 0; }
.content strong { font-weight: 700; }
.content table { border-collapse: collapse; margin: 18px 0; font-size: 15px; }
.table-wrap { overflow-x: auto; max-width: 100%; margin: 18px 0; }
.table-wrap table { margin: 0; }
.content th, .content td { border: 1px solid var(--rule); padding: 7px 12px; text-align: left; vertical-align: top; }
.content th { background: var(--sheet-2); font-weight: 700; }
.content td code, .content th code { white-space: nowrap; }
.content :not(pre) > code { background: var(--code-bg); border: 1px solid var(--grid); border-radius: 5px; padding: .08em .35em; color: var(--code-ink); }
.de { font-weight: 700; color: var(--ink); }
.term { border-bottom: 1.5px dotted var(--ink-3); cursor: help; }

.phase { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phase-tag { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-radius: 6px; padding: 3px 9px; flex: none; }
.phase-logic .phase-tag, .ph.logic { color: var(--violet); background: var(--violet-soft); }
.phase-bridge .phase-tag, .ph.bridge { color: var(--amber); background: var(--amber-soft); }
.phase-python .phase-tag, .ph.python { color: var(--blue); background: var(--blue-soft); }
.phase-exam .phase-tag, .ph.exam { color: var(--red); background: var(--red-soft); }
.phase-intro .phase-tag, .ph.intro { color: var(--green); background: var(--green-soft); }
.toc a .ph { background: none !important; padding: 0; }

/* code blocks */
pre.code, .content pre { background: var(--code-bg); border: 1px solid var(--grid); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-size: 14.5px; line-height: 1.55; color: var(--code-ink); margin: 16px 0; max-width: 100%; }
.content pre code { background: none; border: 0; padding: 0; font-size: inherit; }
pre .lbl { float: right; font-family: var(--f-body); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-left: 12px; }
.cm-s-course .cm-keyword, .tok-kw { color: var(--syn-kw); font-weight: 600; }
.cm-s-course .cm-def, .tok-def { color: var(--syn-def); font-weight: 600; }
.cm-s-course .cm-string, .tok-str { color: var(--syn-str); }
.cm-s-course .cm-number, .tok-num { color: var(--syn-num); }
.cm-s-course .cm-comment, .tok-com { color: var(--syn-com); font-style: italic; }
.cm-s-course .cm-builtin { color: var(--syn-builtin); }
.cm-s-course .cm-operator { color: var(--syn-op); }
.cm-s-course .cm-variable-2 { color: var(--ink); }
.cm-s-course .cm-meta { color: var(--syn-def); }
.cm-s-course .cm-property { color: var(--ink); }
.pseudo .kw { color: var(--violet); font-weight: 700; }

/* callouts */
.callout { border-radius: var(--radius); padding: 14px 18px 14px 18px; margin: 20px 0; border: 1px solid var(--rule); background: var(--sheet); max-width: 80ch; }
.callout > .c-title { font-weight: 700; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.callout > *:last-child { margin-bottom: 0; }
.callout p:first-of-type { margin-top: 0; }
.callout.key { border-color: color-mix(in srgb, var(--blue) 40%, var(--rule)); background: var(--blue-soft); }
.callout.key > .c-title { color: var(--blue); }
.callout.warn { border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); background: var(--red-soft); }
.callout.warn > .c-title { color: var(--red); font-family: var(--f-hand); font-size: 24px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
.callout.tip { border-color: color-mix(in srgb, var(--green) 40%, var(--rule)); background: var(--green-soft); }
.callout.tip > .c-title { color: var(--green); }
.callout.note > .c-title { color: var(--ink-2); }
.callout.exam > .c-title { color: var(--red); }

/* figures on squared paper */
figure.diagram, .viz, .bridge, .tracer-box {
  margin: 24px 0; background-color: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow);
}
figure.diagram { padding: 18px; overflow-x: auto; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; }
figure.diagram svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
figure.diagram.wide svg { max-width: none; }
figcaption, .fig-cap { font-size: 14px; color: var(--ink-2); margin-top: 10px; text-align: center; background: var(--sheet); display: table; margin-left: auto; margin-right: auto; padding: 2px 10px; border-radius: 6px; }
.svg-text { fill: var(--ink); font-family: var(--f-body); }
.svg-mono { fill: var(--ink); font-family: var(--f-mono); }
.svg-hand { fill: var(--red); font-family: var(--f-hand); font-weight: 700; }

/* bridge: logic ↔ python */
.bridge { overflow: hidden; }
.bridge-head { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--rule); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.bridge-head div { padding: 10px 16px; }
.bridge-head div:first-child { color: var(--violet); background: var(--violet-soft); }
.bridge-head div:last-child { color: var(--blue); background: var(--blue-soft); }
.bridge-title { padding: 12px 16px 0; font-weight: 700; }
.bridge-rows { overflow-x: auto; }
.bridge table { width: 100%; border-collapse: collapse; margin: 0; font-size: 14px; }
.bridge td { border: 0; border-bottom: 1px dashed var(--grid); padding: 3px 16px; vertical-align: top; font-family: var(--f-mono); white-space: pre; width: 50%; }
.bridge td.ps { border-right: 1px solid var(--rule); }
.bridge tr.cmt td { font-family: var(--f-body); white-space: normal; color: var(--ink-2); font-size: 13.5px; background: var(--sheet-2); padding: 6px 16px; }
.bridge tr:hover td:not(.c) { background: var(--amber-soft); }
.bridge .note-row td { font-family: var(--f-body); white-space: normal; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink); line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
:root[data-theme="dark"] .btn.primary { color: #0d121b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0d121b; } }
.btn.primary:hover { background: var(--blue-2); border-color: var(--blue-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sheet-2); color: var(--ink); }
.btn .k { font-family: var(--f-mono); font-weight: 400; font-size: 11px; opacity: .7; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* exercise (Python block) */
.exercise { margin: 30px 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); box-shadow: var(--shadow); overflow: hidden; }
.ex-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--rule); background: var(--sheet-2); flex-wrap: wrap; }
.ex-tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); background: var(--blue-soft); border-radius: 6px; padding: 3px 8px; }
.ex-num { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); }
.ex-title { font-family: var(--f-display); font-weight: 700; font-size: 18px; flex: 1; min-width: 180px; }
.ex-level { display: inline-flex; gap: 3px; }
.ex-level i { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
.ex-level i.on { background: var(--amber); }
.ex-state { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.ex-state.solved { color: var(--green); }
.ex-body { padding: 16px 18px 6px; }
.ex-task { max-width: 76ch; }
.ex-task > :first-child { margin-top: 0; }
.ex-task pre { font-size: 13.5px; }
.ex-editor { margin: 14px 18px 0; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.ex-editor .CodeMirror { height: auto; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.55; background: var(--code-bg); color: var(--code-ink); }
.ex-editor .CodeMirror-scroll { height: auto; min-height: 96px; max-height: 640px; }
.CodeMirror-gutters { background: var(--sheet-2); border-right: 1px solid var(--grid); }
.CodeMirror-linenumber { color: var(--ink-3); }
.CodeMirror-cursor { border-left: 2px solid var(--ink); }
.CodeMirror-selected { background: color-mix(in srgb, var(--blue) 18%, transparent) !important; }
.CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--blue) 26%, transparent) !important; }
.CodeMirror-matchingbracket { color: var(--green) !important; text-decoration: underline; }
.cm-errline { background: var(--red-soft) !important; }
.ex-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; align-items: center; }
.ex-tools .spacer { flex: 1; }
.ex-out { border-top: 1px solid var(--rule); padding: 14px 18px 16px; background: var(--sheet); }
.ex-out:empty { display: none; }
.out-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
